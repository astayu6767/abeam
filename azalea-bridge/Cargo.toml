[package]
name = "azalea-bridge"
version = "0.1.0"
edition = "2021"
description = "JSON-lines sidecar that drives an Azalea (Rust) Minecraft client for MC Bot Manager"

[dependencies]
azalea = { version = "0.16.0", default-features = true }
azalea-auth = "0.16.0"
azalea-registry = "0.16.0"
eyre = "0.6"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[profile.release]
lto = false
codegen-units = 8
opt-level = 3
debug = false
strip = true
